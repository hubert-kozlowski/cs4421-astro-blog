name: Deploy Astro Static Site via AWS CDK

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22.12.0

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Install CDK Dependencies
        working-directory: ./cdk
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve SSR Dashboard URL
        run: |
          url="$(aws cloudformation describe-stacks \
            --stack-name CdkStack \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue | [0]" \
            --output text)"
          if [ "$url" = "None" ] || [ -z "$url" ]; then
            echo "Could not resolve the deployed SSR dashboard URL." >&2
            exit 1
          fi
          echo "PUBLIC_SSR_SITE_URL=$url" >> "$GITHUB_ENV"

      - name: Build Static Site
        run: npm run build:static

      - name: Deploy Infrastructure & Assets with AWS CDK
        working-directory: ./cdk
        run: npx cdk deploy StaticSiteStack --require-approval never
