name: Deploy Astro SSR Container via AWS CDK

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22.12.0
  # Configure this as a repository or environment variable when the custom domain is ready.
  SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    environment:
      name: production-ssr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare Static Asset Placeholder for CDK Synthesis
        run: |
          mkdir -p static-source/dist
          printf '%s\n' '<!doctype html><title>Static assets are deployed separately</title>' \
            > static-source/dist/index.html

      - name: Setup CDK Node.js Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK Dependencies
        working-directory: ./cdk
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Infrastructure & Assets with AWS CDK
        working-directory: ./cdk
        run: npx cdk deploy CdkStack --require-approval never
