name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs opt into more if they ever need it.
permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Project Dependencies
        run: npm ci # Clean, deterministic install from package-lock.json

      - name: Run ESLint
        run: npm run lint

      - name: Run Astro Type Check
        run: npm run check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  build:
    name: Build & SSR Deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Checkout Static Release 1.0.0
        uses: actions/checkout@v4
        with:
          ref: 1.0.0
          path: static-source

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static-source/package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Site
        run: npm run build

      - name: Install Static Release Dependencies
        working-directory: ./static-source
        run: npm ci

      - name: Build Static Release 1.0.0
        working-directory: ./static-source
        run: |
          node ../scripts/configure-static-site-origin.mjs . https://static-preview.invalid
          npm run build

      - name: Install CDK Dependencies
        working-directory: ./cdk
        run: npm ci

      - name: Test CDK Stack
        working-directory: ./cdk
        run: npm test

      - name: Build CDK Application
        working-directory: ./cdk
        run: npm run build

      - name: Synthesize SSR Infrastructure
        working-directory: ./cdk
        run: npx cdk synth --quiet

      - name: Build SSR Container Image
        run: docker build --tag gridiron-atlas-ssr:ci .

      - name: Smoke Test SSR Container
        shell: bash
        run: |
          set -euo pipefail
          container_name=gridiron-atlas-ssr-smoke
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" --publish 4321:4321 gridiron-atlas-ssr:ci

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 3 http://127.0.0.1:4321/api/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "SSR container did not become ready within 60 seconds" >&2
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:4321/api/health \
            | jq --exit-status '.status == "ok" and (.uptime | type == "number" and . >= 0)'
          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:4321/api/live | jq --exit-status '.status == "ok"'
          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:4321/ | grep '<html' >/dev/null

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
          retention-days: 5
