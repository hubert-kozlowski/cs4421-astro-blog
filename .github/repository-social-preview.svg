<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Gridiron Atlas repository social preview</title>
  <desc id="desc">A polished navy repository card for the Gridiron Atlas NFL scores, schedules, and standings application.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="40" x2="1210" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="0.58" stop-color="#1B2A49"/>
      <stop offset="1" stop-color="#30213A"/>
    </linearGradient>
    <radialGradient id="red-glow" cx="0" cy="0" r="1" gradientTransform="translate(1075 82) rotate(127) scale(430 540)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9293A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#C9293A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientTransform="translate(188 650) rotate(-61) scale(430 600)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#365B94" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#365B94" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="80" y1="62" x2="142" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#365B94"/>
      <stop offset="1" stop-color="#C9293A"/>
    </linearGradient>
    <linearGradient id="ball" x1="790" y1="180" x2="1160" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D94A5B"/>
      <stop offset="1" stop-color="#8E1F31"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#080D17" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#red-glow)"/>
  <rect width="1280" height="640" fill="url(#blue-glow)"/>
  <path d="M0 522C224 459 369 482 548 640H0V522Z" fill="#FFFFFF" fill-opacity="0.018"/>

  <g opacity="0.12" stroke="#FFFFFF" fill="none">
    <path d="M48 48H1232V592H48Z" rx="24"/>
    <path d="M48 116H1232"/>
  </g>

  <g transform="translate(74 58)">
    <rect width="68" height="68" rx="19" fill="url(#mark)" filter="url(#shadow)"/>
    <text x="34" y="45" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="-2.2" text-anchor="middle">GA</text>
    <text x="88" y="28" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="1.2">GRIDIRON</text>
    <text x="88" y="51" fill="#AAB5C9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="1.2">ATLAS</text>
  </g>

  <g transform="translate(76 184)">
    <text x="0" y="0" fill="#E3B9C1" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3.5">NFL DATA DASHBOARD</text>
    <text x="0" y="86" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-5.4">Every game.</text>
    <text x="0" y="166" fill="#F07483" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="800" letter-spacing="-5.4">One place.</text>
    <text x="3" y="219" fill="#CCD5E4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Schedules, scores, standings &amp; matchups.</text>
  </g>

  <g transform="rotate(-9 972 326)" filter="url(#shadow)">
    <path d="M758 326Q970 124 1182 326Q970 528 758 326Z" fill="url(#ball)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
    <path d="M824 269Q801 326 824 383" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="13" stroke-linecap="round"/>
    <path d="M1116 269Q1139 326 1116 383" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="13" stroke-linecap="round"/>
    <path d="M902 326H1038" fill="none" stroke="#FFFFFF" stroke-opacity="0.94" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#FFFFFF" stroke-opacity="0.96" stroke-width="8" stroke-linecap="round">
      <path d="M923 305V347"/>
      <path d="M947 302V350"/>
      <path d="M971 301V351"/>
      <path d="M995 302V350"/>
      <path d="M1019 305V347"/>
    </g>
    <path d="M787 326Q970 158 1153 326" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <g fill="#FFFFFF" opacity="0.24">
    <circle cx="1187" cy="89" r="3"/>
    <circle cx="1210" cy="113" r="2"/>
    <circle cx="1158" cy="69" r="2"/>
  </g>
  <text x="1204" y="560" fill="#AAB5C9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="end">V2.1</text>
</svg>
